<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <circle cx="100" cy="100" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="300" cy="200" r="5" fill="#a78bfa">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="100" r="5" fill="#2dd4bf">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="300" r="5" fill="#f472b6">
    <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <line x1="100" y1="100" x2="300" y2="200" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <line x1="300" y1="200" x2="500" y2="100" stroke="#a78bfa" stroke-width="1" opacity="0.5" />
  <line x1="500" y1="100" x2="700" y2="300" stroke="#2dd4bf" stroke-width="1" opacity="0.5" />
  <line x1="100" y1="100" x2="500" y2="100" stroke="#0d1117" stroke-width="1" opacity="0.2" />

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="24" fill="#8b949e" letter-spacing="4">NEURAL NETWORK</text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="14" fill="#30363d">CONCEPT VISUALIZATION</text>
</svg>
